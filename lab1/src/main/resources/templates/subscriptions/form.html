<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${formTitle})}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>

<main class="container">
    <div class="page-header">
        <h1 th:text="${formTitle}">Підписка</h1>
        <a class="btn btn-ghost" th:href="@{/subscriptions}">Назад до списку</a>
    </div>

    <form th:action="${formAction}" th:object="${subscription}" method="post" class="card-form">
        <div class="field">
            <label for="name">Назва</label>
            <input id="name" type="text" th:field="*{name}" required>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="field">
            <label for="price">Ціна</label>
            <input id="price" type="number" step="0.01" min="0.01" th:field="*{price}" required>
            <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="field">
            <label for="billingDate">Дата наступної оплати</label>
            <input id="billingDate" type="date" th:field="*{billingDate}" required>
            <p class="field-error" th:if="${#fields.hasErrors('billingDate')}" th:errors="*{billingDate}"></p>
        </div>

        <div class="field">
            <label for="userId">Користувач</label>
            <select id="userId" th:field="*{userId}" required>
                <option value="">— оберіть —</option>
                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.username + ' (' + user.role + ')'}">user</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></p>
        </div>

        <div class="field">
            <label for="categoryId">Категорія</label>
            <select id="categoryId" th:field="*{categoryId}" required>
                <option value="">— оберіть —</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">Streaming</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Зберегти</button>
            <a class="btn btn-ghost" th:href="@{/subscriptions}">Скасувати</a>
        </div>
    </form>
</main>
<script th:if="${errorMessage}" th:inline="javascript">
    alert([[${errorMessage}]]);
</script>
</body>
</html>
