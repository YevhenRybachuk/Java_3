spring:
  application:
    name: lab1

  datasource:
    url: jdbc:mysql://localhost:3307/subscriptiondb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: subscriptionScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 4
      org.quartz.threadPool.threadNamePrefix: subscription-quartz-
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: subscription-ui
            client-secret: SkCtA9taUtiIjr9G95TnyCb6rjl91ZVk
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/subscription-tracker
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/subscription-tracker
